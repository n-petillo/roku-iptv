name: android-release

# Tag android-vX.Y.Z to build a signed APK and attach it to a GitHub Release.
# (Roku releases use plain vX.Y.Z tags and release.yml.)
on:
  push:
    tags: ["android-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Version from tag
        run: |
          ref="${GITHUB_REF_NAME#android-v}"
          if [[ "$ref" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            name="$ref"
            code=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          else
            name="0.0.0-dev"
            code=1
          fi
          echo "FST_VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "FST_VERSION_CODE=$code" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build signed APK
        env:
          FST_KEYSTORE_B64: ${{ secrets.FST_KEYSTORE_B64 }}
          FST_KEYSTORE_PASSWORD: ${{ secrets.FST_KEYSTORE_PASSWORD }}
        run: |
          echo "$FST_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export FST_KEYSTORE="$RUNNER_TEMP/release.jks"
          ./gradlew --no-daemon :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/fedsmokertv.apk"
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/fedsmokertv.apk" --title "FedSmokerTV for Android TV $FST_VERSION_NAME" --notes "Signed APK for Google TV / Android TV. See the README for sideloading."

      - uses: actions/upload-artifact@v4
        with:
          name: fedsmokertv-apk
          path: ${{ runner.temp }}/fedsmokertv.apk
